# позитивный
- summary: |
    Поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    Открыта страница https://hexlet-products-store.vercel.app/
    Русский язык интерфейса
    Проставлена "галочка" в поле "в наличии"
  test-data: | 
  steps:
    - Пролистать 4 страницы нажатием на кнопку "Следующая" до категории "smartphones"
    - В окне "поиск" ввести "iPhone 6"
  expected-result: |
    Поиск выводит на экран товар с названием "iPhone 6"

