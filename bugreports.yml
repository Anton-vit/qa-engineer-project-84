---
- summary: |
    Не работает поиск при слитном написании запроса
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Открыть страницу https://hexlet-products-store.vercel.app/
    Пролистать 4 страницы нажатием на кнопку "Следующая" до категории "smartphones"
    В окне "поиск" ввести "iPhone6"
  expected-result: |
    Поиск выводит на экран товар с названием "iPhone 6"
  actual-result: |
    В результатах поиска выводится сообщение:"Nothing found!"

- summary: |
    Не работает поиск по ключевому слову на русском языке
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Открыть страницу https://hexlet-products-store.vercel.app/
    Пролистать 4 страницы нажатием на кнопку "Следующая" до категории "smartphones"
    В окне "поиск" ввести "смартфон"
  expected-result: |
    Поиск выводит на экран все товары с описанием "smartphone"
  actual-result: |
    В результатах поиска выводится сообщение:"Nothing found!"

- summary: |
       Не работает поиск "iPhone" с главной (первой страницы) сайта
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Открыть страницу https://hexlet-products-store.vercel.app/
    В окне "Search" ввести "iphone"
  expected-result: |
    Поиск выводит на экран все товары с наименованием "iPhone"
  actual-result: |
    В результатах поиска выводится сообщение:"Nothing found!"

- summary: |
    Отсутствие возможности выбрать категории товара 
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Открыть страницу https://hexlet-products-store.vercel.app/
    В левой части экрана под окном "Search" нажать на меню "Categories"
    Выбрать их списка категорий категорию "motorcycle'
  expected-result: |
    Поиск выводит на экран все товары категории "motorcycle"
  actual-result: |
    Данная категория не отображается в выпадающем списке

- summary: |
    Исчезание товаров при деактивации фильтра "в наличии"
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
     Открыть страницу https://hexlet-products-store.vercel.app/
     В левой части экрана убрать "галочку" в строке "В наличии"
  expected-result: |
    Пользователь должен увидеть товары которые есть в наличии и
    которых нет в наличии
  actual-result: |
    В результатах поиска выводится сообщение:"Nothing found!"

- summary: |
    Не полное переключение интерфейса на русский язык
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Открыть страницу https://hexlet-products-store.vercel.app/ (открывается на английском языке)
    Кликнуть на кнопке "Language" в правом верхнем углу
    В выпавшем окне кликнуть по значению "Russian"
  expected-result: |
    Интерфейс переключится на русский
  actual-result: |
    Карточки товаров с описанием, категории, названия остались на английском языке

- summary: |
    Не корректное отображение на устройствах Galaxy Mini S5570
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    В браузере открыть сайт http://adaptivator.ru/
    В верхней части экрана в строку поиска ввести адрес https://hexlet-products-store.vercel.app/
    Справа от строко поиска нажать кнопку "узнать"
    Просмотреть, как страница открывается на предложенных устройствах
  expected-result: |
    Приложение корректно отображается на выбранных устройствах
  actual-result: |
    При портретном расположении экрана на смартфонах Galaxy Mini S5570 кнопка "Add to Cart" скрывается за изображением о товаре
