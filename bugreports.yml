- summary: |
    Плывет верстка в мобильной версии сайта
  environment: |
     iPhone 13 Pro OC: iOS 18.3.2 Safari 18.3.2 
     Infinix Note 40 Android 14 Яндекс Браузер 25.2.7
  steps-to-reproduce: |
    Открыть сайт на мобильном устройстве
  expected-result: |
    Верстка в порядке
  actual-result: |
    Верстка плывет, фотографии товара сжимаются (Скриншот 14)

- summary: |
    Не полное переключение интерфейса на русский язык
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Кликнуть на кнопке "Language"
    В выпавшем окне кликнуть по значению "Russian"
  expected-result: |
    Интерфейс переключится на русский
  actual-result: |
    Карточки товаров с описанием, категории, названия остались на английском языке (Скриншот 15)

- summary: |
    Не корректный поиск по цене при выборе нескольких опций фильтрации
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Выбрать категорию fragrances
    Выбрать бренды Calvin Klein, Chanel, Dior, Gucci
    В фильтре по цене указать диапазон от 70 до 100 $
    Проставить галочку в поле "В наличии"
  expected-result: |
    Отобразяться товары по цене от 70 до 100 $
  actual-result: |
    Отобразился товар с ценой менее 70 $ (Скриншот 32)
