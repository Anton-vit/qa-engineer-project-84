- summary: |
    Исчезание товаров при деактивации фильтра "в наличии"
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
     Убрать галочку в строке в наличии
  expected-result: |
    Пользователь должен увидеть товары которые есть в наличии и которых нет в наличии
  actual-result: |
    В результатах поиска выводится сообщение Nothing found (Скриншот 7)

- summary: |
    Фильтр не фильтрует товары поцене
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    В поле Цена от указать 0
    В поле Цена до указать 1.95
  expected-result: |
    Пользователь должен увидеть товары со стоимостью от 0 до 1.95 $
  actual-result: |
    Товар с ценой 1.95 не включен в результат поиска (Скриншот 10)

