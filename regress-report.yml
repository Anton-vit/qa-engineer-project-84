bugreports:
  - summary: |
      Поехала вёрстка
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Открыть страницу https://hexlet-products-store.vercel.app/
    expected-result: |
      Вёрстка в порядке
    actual-result: |
      Поехала вёрстка (Скриншот 1)


  
  - summary: |
      Отсутствие возможности пролистать страницы
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
      Пролистать 4 страницы нажатием на кнопку "Следующая" до категории "smartphones"
    expected-result: |
      Страница пролистывается до товаров категории "smartphones"
    actual-result: |
      Пролистывается одна страница, затем предлагается перейти на предыдущую
  
  - summary: |
      Не работает поиск "iPhone" с главной (первой страницы) сайта
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
      В окне "Search" ввести "iphone"
    expected-result: |
      Поиск выводит на экран все товары с наименованием "iPhone"
    actual-result: |
      В результатах поиска выводится сообщение:"Nothing found!"
  
  - summary: |
      Отсутствие возможности выбрать категорию товара 
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
      Нажать на меню "Categories"
      Выбрать их списка категорий категорию "motorcycle'
    expected-result: |
      Поиск выводит на экран все товары категории "motorcycle"
    actual-result: |
      Данная категория не отображается в выпадающем списке
  
  - summary: |
      Исчезание товаров при деактивации фильтра "в наличии"
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
      Убрать "галочку" в строке "В наличии"
    expected-result: |
      Пользователь должен увидеть товары которые есть в наличии и которых нет в наличии
    actual-result: |
      В результатах поиска отображаются только те товары, которых нет в наличии
  
  - summary: |
      Пропали страницы с товарами
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
      Пролистать страницы нажатием на кнопку "Next"
    expected-result: >
      Поиск выводит на экран "плитку" товаров с описанием, ценой, ценой со скидкой, кнопкой добавления в корзину 
    actual-result: |
      В магазине осталось всего две страницы
 
  - summary: |
      Обрезка фотографий товара при просмотре со смартфона
    environment: |
      Смартфон Infinix Note 40
      Android 14
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
    expected-result: |
      Фотографии товара открываются полностью
    actual-result: |
      Фотографии товара обрезаются сверху и снизу
  
  - summary: |
      Обрезка фотографий товара при просмотре со смартфона
    environment: |
      Смартфон Iphone 16 pro
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
    expected-result: |
      Фотографии товара открываются полностью
    actual-result: |
      Фотографии товара обрезаются сверху и снизу
  
  - summary: |
      Обрезка фотографий товара при просмотре с ПК
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: >
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
    expected-result: |
      Поиск выводит на экран "плитку" товаров с полным изображением товара
    actual-result: |
      Фотографии товара обрезаются сверху и снизу
  
  - summary: |
      Не полное переключение интерфейса на русский язык
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: >
      Открыть страницу https://hexlet-products-store.vercel.app/
      (открывается на английском языке)
      Кликнуть на кнопке "Language" в правом верхнем углу
      В выпавшем окне кликнуть по значению "Russian"
    expected-result: |
      Интерфейс переключится на русский
    actual-result: >
      Карточки товаров с описанием, категории, названия остались на
      английском языке
