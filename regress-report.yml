bugreports:
- summary: |
    Поехала верстка при выводе результата поиска
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    В окне поиск ввести ключевое слово cat
  expected-result: |
    Верстка в порядке
  actual-result: |
    Поехала верстка (Скриншот 21)

- summary: |
      Не работает поиск при слитном написании запроса
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      В окне поиск ввести название товара слитно (например catfood) 
    expected-result: |
      Поиск выводит на экран товар с указанным названием
    actual-result: |
      Поиск не срабатывает, открывается главная страница сайта (Скриншот 22)

- summary: |
      Не работает поиск по ключевому слову на русском языке
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      В окне поиск ввести название товара на русском языке
    expected-result: |
      Поиск выводит на экран товар с указанным названием
    actual-result: |
      Отображается главная страница сайта (Скриншот 24)

- summary: |
    Отсутствует возможность пролистывания сайта при деактивации фильтра в наличии
  environment: |
    Яндекс Браузер Версия 25.2.6.697 (64-bit)
    OC Windows 10 pro 22H2
  steps-to-reproduce: |
    Убрать галочку в строке в наличии
  expected-result: |
    Пользователь должен увидеть товары которые есть в наличии и
    которых нет в наличии
  actual-result: |
    Пропадают кнопки переключения страниц сайта (Скриншот 25)

- summary: |
      Фильтр не фильтрует товар по конкретной цене
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      В поле Цена от указать 1.95
      В поле Цена до указать 1.95
    expected-result: |
      Пользователь должен увидеть товары со стоимостью 1.95 $
    actual-result: |
      Отображается главная страница сайта (Скриншот 27)

  - summary: |
      Не корректный поиск по цене при выборе нескольких опций фильтрации
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Выбрать категорию fragrances
      Выбрать бренды Calvin Klein, Chanel, Dior, Gucci
      В фильтре по цене указать от 70 до 100 $
      Проставить галочку в поле "В наличии"
    expected-result: |
      Отобразяться товары по цене от 70 до 100 $
    actual-result: |
      Отобразился товар с ценой менее 70 $ (Скриншот 33)

- summary: |
      Не корректная фильтрация цены от большей к меньшей
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      В фильтре по цене указать от 20 до 10 $
    expected-result: |
      Поиск выдаст результат "Nothing found!"
    actual-result: |
      Отобразились все товары страницы (Скриншот 34)

  - summary: |
      Отсутствует сообщение "Nothing found"      
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      В окне поиск ввести название не существующего товара (например jdkv vjd) 
    expected-result: |
      Поиск выдаст сообщение "Nothing found"
    actual-result: |
      Поиск перестал выдавать значение Nothing found  (Скриншот 23)
  
  - summary: |
      Кнопки добавления в корзину разного размера
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
    expected-result: |
      Вёрстка в порядке
    actual-result: |
      Поехала верстка  (Скриншот 16)
  
  - summary: |
      При переключении интерфейса на русский язык плывет верстка
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Открыть страницу
      https://products-store-git-v2bugfixes-hexlet-components.vercel.app/
    expected-result: |
      Вёрстка в порядке
    actual-result: |
      Поехала верстка  (Скриншот 17)
  
  - summary: |
      Ошибка отображения иконки языка интерфейса
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Кликнуть кнопку переключения языка 
    expected-result: |
      Выпадает вкладка выбора языка формата: иконка флага/язык интерфейса
    actual-result: |
      Не отображается иконки языков интерфейса (Скриншот 18)
 
  - summary: |
      Фотографии выполнены не в одном стиле
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Открыть страницу https://hexlet-products-store.vercel.app/
    expected-result: |
      Все фотографии одного размера (нет слишком маленьких или
      больших), выполнены в одном дизайне, нет рамок, один цветовой фон
    actual-result: |
      Некоторые фотографии имеют рамки по бокам, фотографии товара
      обрезаны (Скриншот 19)
  
  - summary: |
      Кнопка закрытия не реагирует на нажатие
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Добавить любой товар в корзину
      Перейти в корзину
      Нажать оформить заказ
      В в появившемся окне нажать на крестик для закрытия 
    expected-result: |
      После нажатия на крестик окно закроется
    actual-result: |
      Кнопка закрытия не реагирует на нажатие (Скриншот 20)

  - summary: |
      Плывет верстка в мобильной версии сайта
    environment: |
      iPhone 13 Pro OC: iOS 18.3.2 Safari 18.3.2 
      Infinix Note 40 Android 14 Яндекс Браузер 25.2.7
    steps-to-reproduce: |
      Открыть сайт на мобильном устройстве
    expected-result: |
      Верстка в порядке
    actual-result: |
      Верстка плывет, фотографии товара обрезаются (Скриншот 30)
  
  - summary: |
      Не полное переключение интерфейса на русский язык
    environment: |
      Яндекс Браузер Версия 25.2.6.697 (64-bit)
      OC Windows 10 pro 22H2
    steps-to-reproduce: |
      Кликнуть на кнопке "Language"
      В выпавшем окне кликнуть по значению "Russian"
    expected-result: |
      Интерфейс переключится на русский
    actual-result: |
      Карточки товаров с описанием, категории, названия остались на
      английском языке (Скриншот 31)




